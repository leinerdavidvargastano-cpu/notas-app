<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
        <!-- Ficha de la app instalable -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#fffaf3" />

    <!-- Para iPhone (iOS ignora parte del manifiesto y usa estas etiquetas) -->
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MAYLEN" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galería · Nuestros recuerdos</title>
    <link rel="stylesheet" href="style.css" />
        <!-- Icono que aparece en la pestaña del navegador -->
        <link rel="icon" href="img/logo_maylen.ico" sizes="any" />
        
            <noscript><style>.pantalla-carga { display: none; }</style></noscript>
      </head>

  <body>    
    <!-- Pantalla de carga: cubre toda la página hasta confirmar la sesión -->
    <!-- role="status" y aria-live: un lector de pantalla anuncia los cambios del texto -->
    <div id="pantalla-carga" class="pantalla-carga" role="status" aria-live="polite">
      <img class="carga-logo" src="img/logo.png" alt="MAYLEN" width="140" height="140" />
      <div class="carga-anillo" aria-hidden="true"></div>
      <p class="carga-texto" id="carga-texto">Cargando…</p>
      <!-- Solo aparece si algo falla -->
      <button type="button" id="carga-reintentar" class="boton-texto" hidden>Reintentar</button>
    </div>
        
        <header class="header">
      <div class="header-interior">

        <!-- Logo a la izquierda. alt="" porque el enlace ya tiene su aria-label -->
        <a class="header-logo" href="/" aria-label="MAYLEN, ir al inicio">
          <img src="img/logo.png" alt="" width="72" height="72" />
        </a>

        <!-- Título en el centro -->
        <div class="header-titulo">
          <h1>Nuestros recuerdos</h1>
          <p class="subtitulo">Lo que no queremos olvidar</p>
        </div>

        <!-- Cerrar sesión a la derecha. Conserva el id="cerrar-sesion": tu JavaScript lo usa -->
        <button type="button" id="cerrar-sesion" class="boton-salir" aria-label="Cerrar sesión">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <path d="M16 17l5-5-5-5" />
            <path d="M21 12H9" />
          </svg>
          <span class="boton-salir-texto">Cerrar sesión</span>
        </button>

      </div>

      <!-- Menú: en PC va debajo del título; en celular, fijo abajo como una app -->
      <!-- marca la página en la que estás -->
      <nav class="menu" aria-label="Menú principal">
        <a class="menu-item" href="/">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5" /><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5" /></svg>
          <span>Inicio</span>
        </a>
        <a class="menu-item" href="/galeria.html" aria-current="page">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2" /><circle cx="8.5" cy="9.5" r="1.5" /><path d="m21 16-5-5-9 9" /></svg>
          <span>Galería</span>
        </a>
        <a class="menu-item" href="/calendario.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2" /><path d="M16 3v4M8 3v4M3 10h18" /></svg>
          <span>Calendario</span>
        </a>
        <a class="menu-item" href="/preguntas.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-5A8 8 0 1 1 21 12z" /><path d="M9.8 9.5a2.3 2.3 0 0 1 4.4.8c0 1.5-2.2 2-2.2 3.2" /><path d="M12 16.5h.01" /></svg>
          <span>Preguntas</span>
        </a>
      </nav>
    </header>

    <main class="galeria">

      <div class="galeria-cabecera">
        <div>
          <h2>Galería</h2>
          <p>Nuestras fotos, con la historia de cada una.</p>
        </div>
        <button type="button" id="abrir-subir" class="boton-subir">+ Subir foto</button>
      </div>

      <!-- Aquí el JavaScript pone una tarjeta por cada foto -->
      <ul id="fotos" class="fotos"></ul>
      <p id="fotos-vacio" class="vacio" hidden>Todavía no hay fotos. Sube la primera.</p>
    </main>

    <!-- VENTANA PARA SUBIR UNA FOTO -->
    <dialog id="ventana-subir" class="selector ventana-foto">
      <form id="form-foto" class="form-foto">
        <h2>Subir foto</h2>

        <!-- Vista previa: se llena al elegir la foto -->
        <label class="elegir-foto" for="archivo">
          <img id="vista-previa" alt="" hidden />
          <span id="elegir-texto">Toca para elegir una foto</span>
        </label>
        <!-- accept="image/*": solo deja elegir imágenes (en el celular abre galería o cámara) -->
        <input id="archivo" type="file" accept="image/*" required class="oculto-visual" />

        <label for="foto-descripcion">Descripción</label>
        <textarea id="foto-descripcion" rows="3" maxlength="500" placeholder="¿Qué pasó ese día?"></textarea>

        <label for="foto-lugar">Lugar</label>
        <input id="foto-lugar" type="text" maxlength="100" placeholder="¿Dónde fue?" />

        <label for="foto-fecha">Fecha</label>
        <input id="foto-fecha" type="date" />

        <p id="foto-error" class="foto-error" role="alert"></p>

        <div class="botones-confirmar">
          <button type="button" id="cancelar-subir" class="boton-cancelar">Cancelar</button>
          <button type="submit" id="boton-guardar-foto">Guardar foto</button>
        </div>
      </form>
    </dialog>

    <!-- VENTANA PARA VER UNA FOTO EN GRANDE -->
    <dialog id="ventana-ver" class="ventana-ver">
      <button type="button" id="cerrar-ver" class="cerrar-ver" aria-label="Cerrar">✕</button>
      <img id="foto-grande" alt="" />
      <div class="foto-info">
        <p id="ver-datos" class="foto-datos"></p>
        <p id="ver-descripcion" class="foto-descripcion"></p>
        <button type="button" id="borrar-foto" class="boton-eliminar" hidden>Eliminar foto</button>
      </div>
    </dialog>

    <script src="comun.js"></script>
    <script src="galeria.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
      <!-- Ficha de la app instalable -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#fffaf3" />

    <!-- Para iPhone (iOS ignora parte del manifiesto y usa estas etiquetas) -->
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MAYLEN" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar</title>

  <!-- Primero tu CSS de siempre (colores, fondo, campos, botones)... -->
  <link rel="stylesheet" href="style.css">
  <!-- ...y después el de esta pantalla. Si dos reglas chocan, gana la que va después -->
  <link rel="stylesheet" href="login.css">
      <!-- Icono que aparece en la pestaña del navegador -->
    <link rel="icon" href="img/maylen.ico" sizes="any" />
</head>
<body>

  <!-- El mismo encabezado vinotinto de tu página principal -->
    <header class="header header-login">
    <div class="header-interior">

      <!-- Aquí el logo no es un enlace: sin sesión, "/" mandaría de vuelta al login -->
      <div class="header-logo">
        <img src="img/logo.png" alt="MAYLEN" width="96" height="96" />
      </div>

      <div class="header-titulo">
        <h1>Nuestros recuerdos</h1>
        <p class="subtitulo">Un lugar para nuestra historia</p>
      </div>

    </div>
  </header>

  <main class="contenedor contenedor-login">

        <!-- Logo de la app. alt: el texto que lee un lector de pantalla -->
    

    <!-- FORMULARIO DE INICIAR SESIÓN -->
    <!-- class="formulario": reutiliza la tarjeta y los campos de style.css -->
    <form id="form-login" class="formulario">
      <h2>Iniciar sesión</h2>

      <input type="email" id="login-email" placeholder="Correo" required>
      <input type="password" id="login-password" placeholder="Contraseña" required>

      <button type="submit">Entrar</button>

      <p id="login-error" class="mensaje"></p>

      <p class="cambio">¿Aún no tienes cuenta? <a href="#" id="ir-registro">Crear cuenta</a></p>
    </form>

    <!-- FORMULARIO DE REGISTRO (empieza oculto) -->
    <form id="form-registro" class="formulario" hidden>
      <h2>Crear cuenta</h2>

      <input type="email" id="registro-email" placeholder="Correo" required>
      <input type="password" id="registro-password" placeholder="Contraseña (mínimo 8 caracteres)" minlength="8" required>

      <button type="submit">Crear cuenta</button>

      <p id="registro-error" class="mensaje"></p>

      <p class="cambio">¿Ya tienes cuenta? <a href="#" id="ir-login">Iniciar sesión</a></p>
    </form>

  </main>

  <script src="login.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nuestros recuerdos</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1>Nuestros recuerdos</h1>
      <p class="subtitulo">Lo que escribas aquí se guarda en la base de datos del servidor.</p>
    </header>

    <main class="contenedor">
      <!-- Imagen de portada: pon nosotros.png en la carpeta public -->
      <img class="portada" src="nosotros.png" alt="Lele y Mayita" />

      <form id="formulario" class="formulario">
        <!-- Quién publica: lo llena el JS según la ventana emergente -->
        <p class="publicando">
          Publicando como <strong id="autor-actual"></strong>
          <button type="button" id="cambiar" class="boton-texto">Cambiar</button>
        </p>

        <label for="titulo">Título</label>
        <input id="titulo" name="titulo" type="text" maxlength="80" placeholder="Ponle nombre a este recuerdo" required />

        <label for="texto">Recuerdo</label>
        <textarea id="texto" name="texto" rows="4" placeholder="Escribe algo que no quieras olvidar" required></textarea>

        <button type="submit">Guardar recuerdo</button>
      </form>

      <ul id="lista" class="lista"></ul>
      <p id="vacio" class="vacio" hidden>Todavía no hay recuerdos. Escribe el primero arriba.</p>
    </main>

    <!-- Ventana emergente: <dialog> es una etiqueta nativa de HTML -->
    <dialog id="selector" class="selector">
      <h2>¿Quién eres?</h2>
      <div class="opciones">
        <!-- Fotos: pon lele.jpg y mayita.jpg en public/img/. Si no existen, se ve la inicial -->
        <button type="button" class="opcion" data-autor="lele">
          <span class="avatar" data-i="L"><img src="img/lele.jpg" alt="" onerror="this.remove()" /></span>
          Lele
        </button>
        <button type="button" class="opcion" data-autor="mayita">
          <span class="avatar" data-i="M"><img src="img/mayita.jpg" alt="" onerror="this.remove()" /></span>
          Mayita
        </button>
      </div>
    </dialog>

    <script src="script.js"></script>
  </body>
</html>
